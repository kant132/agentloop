id: find-jaxrs-endpoints
language: java
framework: jaxrs
description: "JAX-RS 路由 + 请求参数扫描（全限定名+短名变体）"

# 类级规则：JAX-RS 资源类（@Path）
class_rules:
  - id: jaxrs_path
    pattern-either:
      - pattern: "@javax.ws.rs.Path($$$)"
      - pattern: "@Path($$$)"
      - pattern: "@Path"
    role: resource
    http_method: ANY

# 方法级规则：HTTP 动词（2 变体：全限定名+短名）
method_rules:
  - id: jaxrs_get
    pattern-either:
      - pattern: "@javax.ws.rs.GET"
      - pattern: "@GET"
    http_method: GET
  - id: jaxrs_post
    pattern-either:
      - pattern: "@javax.ws.rs.POST"
      - pattern: "@POST"
    http_method: POST
  - id: jaxrs_put
    pattern-either:
      - pattern: "@javax.ws.rs.PUT"
      - pattern: "@PUT"
    http_method: PUT
  - id: jaxrs_delete
    pattern-either:
      - pattern: "@javax.ws.rs.DELETE"
      - pattern: "@DELETE"
    http_method: DELETE
  - id: jaxrs_patch
    pattern-either:
      - pattern: "@javax.ws.rs.PATCH"
      - pattern: "@PATCH"
    http_method: PATCH
  - id: jaxrs_sub_path
    pattern-either:
      - pattern: "@javax.ws.rs.Path($$$)"
      - pattern: "@Path($$$)"
      - pattern: "@Path"
    http_method: ANY

# 请求参数规则：JAX-RS 参数注解
param_rules:
  - pattern: "@javax.ws.rs.HeaderParam($$$)"
    param_type: header
  - pattern: "@HeaderParam($$$)"
    param_type: header
  - pattern: "@javax.ws.rs.QueryParam($$$)"
    param_type: query
  - pattern: "@QueryParam($$$)"
    param_type: query
  - pattern: "@javax.ws.rs.PathParam($$$)"
    param_type: path
  - pattern: "@PathParam($$$)"
    param_type: path
  - pattern: "@FormParam($$$)"
    param_type: form
  - pattern: "@BeanParam"
    param_type: bean
